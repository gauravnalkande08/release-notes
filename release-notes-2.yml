name: Release Notes Testing

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  run-release-notes-testing-task:
    runs-on: [self-hosted, axa-go-ssdlc]

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout ref-app-java-boardgame repo
        uses: actions/checkout@v4
        with:
          repository: axa-go-ssdlc/ref-app-java-boardgame
          ref: main
          path: ref-app-java
          token: ${{ secrets.GH_PAT }}

      - name: Verify Java
        run: java -version

      # ===== YOUR EXISTING STEPS =====
      - name: Fetch closed PRs with retries
        run: |
          for i in {1..3}; do
            echo "Attempt $i to fetch PRs..."
            curl --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://github.axa.com/api/v3/repos/axa-go-ssdlc/ref-app-java-boardgame/pulls?state=closed&per_page=100" \
              -o prs.json && break
            sleep 5
          done

      - name: Generate HTML Release Notes
        run: |
          if [ -f prs.json ]; then
            echo "<html><head><title>Release Notes</title></head><body>" > release-notes.html
            echo "<h1>Release Notes</h1>" >> release-notes.html
            echo "<p><b>Generated on:</b> $(date)</p>" >> release-notes.html

            echo "<h2>Associated Pull Requests</h2><ul>" >> release-notes.html
            jq -r '.[] | select(.merged_at != null) | "<li><b>\(.title)</b> by \(.user.login)</li>"' prs.json >> release-notes.html
            echo "</ul>" >> release-notes.html

            echo "</body></html>" >> release-notes.html
          else
            echo "prs.json not found"
            exit 1
          fi

      # ===== NEW STEP =====
      - name: Publish Release Notes to Confluence
        run: python scripts/release_notes_to_confluence.py
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}


import os
import json
import requests
import base64
import sys

# ===== ENV VARIABLES =====
BASE_URL = os.getenv("CONFLUENCE_BASE_URL")
USERNAME = os.getenv("CONFLUENCE_USERNAME")
API_TOKEN = os.getenv("CONFLUENCE_API_TOKEN")
SPACE_KEY = os.getenv("CONFLUENCE_SPACE_KEY")
PARENT_ID = os.getenv("CONFLUENCE_PARENT_ID")  # optional

# ===== VALIDATION =====
if not all([BASE_URL, USERNAME, API_TOKEN, SPACE_KEY]):
    print("❌ Missing required environment variables")
    sys.exit(1)

# ===== AUTH =====
auth = f"{USERNAME}:{API_TOKEN}"
b64_auth = base64.b64encode(auth.encode()).decode()

headers = {
    "Authorization": f"Basic {b64_auth}",
    "Content-Type": "application/json"
}

# ===== CREATE PAGE =====
def create_page(title, html_content):
    data = {
        "type": "page",
        "title": title,
        "space": {"key": SPACE_KEY},
        "body": {
            "storage": {
                "value": html_content,
                "representation": "storage"
            }
        }
    }

    if PARENT_ID:
        data["ancestors"] = [{"id": PARENT_ID}]

    response = requests.post(
        f"{BASE_URL}/rest/api/content",
        headers=headers,
        data=json.dumps(data)
    )

    if response.status_code in [200, 201]:
        print(f"✅ Created page: {title}")
    else:
        print(f"❌ Failed to create page: {response.text}")
        sys.exit(1)

# ===== MAIN =====
def main():
    # Read generated HTML
    try:
        with open("release-notes.html", "r", encoding="utf-8") as f:
            html_content = f.read()
    except FileNotFoundError:
        print("❌ release-notes.html not found")
        sys.exit(1)

    # Generate release title
    release_number = os.getenv("GITHUB_RUN_NUMBER", "1")
    repo_name = os.getenv("GITHUB_REPOSITORY", "repo")

    title = f"Release {release_number} - {repo_name}"

    print(f"📄 Creating Confluence page: {title}")

    create_page(title, html_content)


if __name__ == "__main__":
    main()
